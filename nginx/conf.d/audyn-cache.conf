# http-level bits the audyn-api site needs. Kept in conf.d/ (loaded inside
# the stock http{} block) so /etc/nginx/nginx.conf itself never needs edits.

proxy_cache_path /var/cache/nginx/audyn_audio levels=1:2 keys_zone=audyn_audio:10m
                 max_size=2g inactive=7d use_temp_path=off;

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream audyn_backend {
    least_conn;
    server 127.0.0.1:7001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:7002 max_fails=3 fail_timeout=10s;
    keepalive 16;
}
